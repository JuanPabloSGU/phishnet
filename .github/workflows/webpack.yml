name: NodeJS with Webpack

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "extension/**"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Run ESLint
      run: npx eslint

    - name: Build
      run: npx webpack

