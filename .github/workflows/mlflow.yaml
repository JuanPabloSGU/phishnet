name: CI Pipeline with MLflow

on:
  pull_request:
    branches:
      - main
    paths:
      - "server/phishnet/blueprints/endpoints/**"

jobs:
  build:
    runs-on: arc-runner-set
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f artint/src/setbuilder/requirements.txt]; then pip install -r artint/src/setbuilder/requirements.txt; fi
    
      - name: Create '.env' file
        run: |
            echo ELASTICSEARCH_HOST=${{ secrets.ELASTICSEARCH_HOST }} >> artint/src/setbuilder/.env
            echo ELASTICSEARCH_USER=${{ secrets.ELASTICSEARCH_USER }} >> artint/src/setbuilder/.env
            echo ELASTICSEARCH_PASSWORD=${{ secrets.ELASTICSEARCH_PASSWORD }} >> artint/src/setbuilder/.env

      - name: Start MLflow server
        run: |
          mlflow ui --backend-store-uri sqlite:///mlflow.db --host 127.0.0.1 --port 5000 &
          sleep 5  # Wait for the UI to start

      - name: Run MLflow Experiment
        run: |
          python artint/src/setbuilder/test_models.py
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db  # Use SQLite for backend storage of MLflow
