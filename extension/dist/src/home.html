<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Home</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="home.js" defer></script>
    </head>
    <body>
        <div class="container" style="padding: 20px; width: 350px;">
            <samp>
                Submit a website
            </samp>

            <form id="phishing-form">
                <samp style="font-size: 14px; line-height: 0.5;">
                    <label for="url">URL:</label>
                    <input type="text" id="url" name="url" required>
                </samp>
                <div style="padding-top: 10px; padding-bottom: 10px;">
                    <button class="btn btn-primary" type="submit">
                        <samp style="font-size: 12px;">
                            Submit
                        </samp>
                    </button>
                </div>
            </form>

            <samp style="padding-bottom: 10px;">
                Information
            </samp>

            <samp style="font-size: 12px; line-height: 0.5;">
                <div id="user-info">
                </div>
            </samp>

            <button class="btn btn-primary" id="logout">
                <samp style="font-size: 12px;">
                    Logout
                </samp>
            </button>

            <div>
                <p>
                    <a href="settings.html" target="_blank">
                        <samp>
                            Settings
                        </samp>
                    </a>
                </p>
            </div>

            <samp style="font-size: 14px;">
                Phishing Website Results
            </samp>
            <samp style="font-size: 12px;">
                <div id="phishing-list">
                </div> 
            </samp>
        </div>
    </body>
</html>
