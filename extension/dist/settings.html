<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <title>Settings</title>
    </head>
    <body>
        <div class="container">
            <h1>
                <img src="./images/logo.png" alt="Phishnet Logo" width="25" height="25" style="vertical-align: middle;">
                <samp style="font-size: 24px; vertical-align: middle;"></samp>
                    Phishnet
                </samp>
            </h1>
            <samp style="font-size: 14px;">
                Extension Settings
            </samp>

            <div>
                <samp style="font-size: 12px;">
                    <label>Enable Automatic Search</label>
                    <input class="form-check-input" type="checkbox" id="toggle-automatic-search" />
                    <button class="btn btn-primary" id="save-settings">Save</button>
                </samp>
            </div>
        </div>
        <script src="settings.js"></script>
    </body>
</html>
